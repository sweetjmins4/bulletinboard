<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>온라인 서점</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="top-bar">
      <button id="cartButton" class="cart-button" type="button" aria-label="장바구니 열기">
        🛒 <span id="cartCount" class="cart-count">0</span>
      </button>
      <button id="ordersButton" class="orders-button" type="button" hidden>주문내역</button>
      <button id="openAuthButton" class="login-button" type="button">로그인</button>
      <div id="memberArea" class="member-area" hidden>
        <span id="memberEmail"></span>
        <button id="signOutButton" type="button">로그아웃</button>
      </div>
    </div>

    <main class="store-layout">
      <aside class="sidebar" aria-label="도서 분류">
        <header class="brand-header">
          <h1>베스트</h1>
          <span>더보기 +</span>
        </header>
        <nav class="category-nav">
          <a class="active" href="#bookList">전체</a>
          <a href="#bookList">국내도서</a>
          <a href="#bookList">외국도서</a>
          <a href="#bookList">eBook</a>
          <a href="#bookList">sam</a>
          <a href="#bookList">핫트랙스</a>
          <a href="#bookList">교보Only</a>
          <strong>스테디셀러</strong>
          <a href="#bookList">국내도서</a>
          <a href="#bookList">외국도서</a>
        </nav>
      </aside>

      <section class="content-area">
        <header class="page-header">
          <p class="eyebrow">ONLINE BOOKSTORE</p>
          <h2>이번 주 도서</h2>
          <p class="intro">읽고 싶은 책을 찾아 모의 구매해 보세요.</p>
        </header>

      <form id="searchForm" class="search-form">
        <label for="searchInput">도서 제목 검색</label>
        <div class="search-row">
          <input
            id="searchInput"
            name="search"
            type="search"
            placeholder="예: 업무 자동화"
            autocomplete="off"
          />
          <button type="submit">검색</button>
        </div>
      </form>

      <p id="purchaseMessage" class="purchase-message" aria-live="polite"></p>
      <p id="statusMessage" class="status-message" aria-live="polite"></p>
      <section id="bookList" class="book-list" aria-label="도서 목록"></section>

      </section>
    </main>

    <div id="authModal" class="auth-modal" hidden>
      <section class="auth-dialog" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <button id="closeAuthButton" class="close-auth-button" type="button" aria-label="로그인 창 닫기">×</button>
        <header class="auth-logo">
          <span class="auth-leaf">●</span>
          <h2 id="authTitle">BOOK 서점</h2>
        </header>
        <p id="authMessage" class="auth-message" aria-live="polite"></p>

        <div id="guestArea">
          <form id="signInForm" class="auth-form">
            <label class="sr-only" for="signInEmail">이메일</label>
            <input id="signInEmail" type="email" placeholder="이메일" required autocomplete="email" />
            <label class="sr-only" for="signInPassword">비밀번호</label>
            <input id="signInPassword" type="password" placeholder="비밀번호" required autocomplete="current-password" />
            <button type="submit" class="auth-submit">로그인</button>
            <p class="auth-switch">처음이신가요? <button id="showSignUpButton" type="button">회원가입</button></p>
          </form>

          <form id="signUpForm" class="auth-form" hidden>
            <label class="sr-only" for="signUpEmail">이메일</label>
            <input id="signUpEmail" type="email" placeholder="이메일" required autocomplete="email" />
            <label class="sr-only" for="signUpPassword">비밀번호</label>
            <input id="signUpPassword" type="password" placeholder="비밀번호 (6자 이상)" required minlength="6" autocomplete="new-password" />
            <button type="submit" class="auth-submit">회원가입</button>
            <p class="auth-switch">이미 회원이신가요? <button id="showSignInButton" type="button">로그인</button></p>
          </form>
        </div>
      </section>
    </div>

    <div id="cartModal" class="cart-modal" hidden>
      <section class="cart-dialog" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
        <header class="cart-header">
          <h2 id="cartTitle">장바구니</h2>
          <button id="closeCartButton" class="close-cart-button" type="button" aria-label="장바구니 닫기">×</button>
        </header>
        <p id="cartMessage" class="cart-message" aria-live="polite"></p>
        <section id="cartList" class="cart-list" aria-label="장바구니 도서 목록"></section>
        <button id="checkoutCartButton" class="checkout-cart-button" type="button">구매 진행</button>
      </section>
    </div>

    <div id="ordersModal" class="orders-modal" hidden>
      <section class="orders-dialog" role="dialog" aria-modal="true" aria-labelledby="ordersTitle">
        <header class="orders-dialog-header">
          <h2 id="ordersTitle">내 주문</h2>
          <button id="closeOrdersButton" class="close-cart-button" type="button" aria-label="주문 내역 닫기">×</button>
        </header>
        <section id="ordersSection" class="orders-section" aria-label="내 주문 목록">
          <p id="ordersMessage" class="orders-message" aria-live="polite"></p>
          <section id="ordersList" class="orders-list" aria-label="내 주문 목록"></section>
        </section>
      </section>
    </div>

    <!-- SDK → 설정 → 화면 동작 순서로 불러옵니다. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
